[workspace]
resolver = "3"
members = [
    "crates/cablescope-model",
    "crates/cablescope-audit",
    "crates/cablescope-collect",
    "crates/cablescope-present",
    "crates/cablescope",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/TooMuhtsh/Treasure-cables"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cablescope-model = { path = "crates/cablescope-model" }
cablescope-audit = { path = "crates/cablescope-audit" }
cablescope-collect = { path = "crates/cablescope-collect" }
cablescope-present = { path = "crates/cablescope-present" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
