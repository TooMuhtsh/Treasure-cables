<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="CableScope">
  <!-- Stéthoscope dont le pavillon est une fiche RJ45 : CableScope ausculte le câble. -->
  <rect width="96" height="96" rx="22" fill="#005EB8"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 20 C22 44 28 52 36 52 C44 52 50 44 50 20"/>
    <path d="M36 52 V62 C36 75 45 81 56 81 C65 81 70 78 70 73"/>
  </g>
  <circle cx="22" cy="17" r="5" fill="#FFFFFF"/>
  <circle cx="50" cy="17" r="5" fill="#FFFFFF"/>
  <!-- La fiche, réduite autour de sa jonction avec le tube. -->
  <g transform="translate(70 74) scale(0.75) translate(-70 -74)">
    <!-- Manchon nervuré. -->
    <path d="M62.5 58 H77.5 L76 72 Q76 74 74 74 H66 Q64 74 64 72 Z" fill="#FFFFFF"/>
    <g stroke="#C9D7EA" stroke-width="1" stroke-linecap="round">
      <path d="M65.5 63 H74.5"/><path d="M65.8 66.5 H74.2"/><path d="M66.1 70 H73.9"/>
    </g>
    <!-- Ergot de verrouillage. -->
    <path d="M59 55 L54 40.5 Q53.6 39 55 38.6 L57.2 38 L59 44 Z" fill="#B9D0F2"/>
    <!-- Corps transparent. -->
    <rect x="58" y="28" width="24" height="31" rx="2.2" fill="#CFE0FF" fill-opacity="0.95" stroke="#9DBBE6" stroke-width="1"/>
    <!-- Les 8 fils (T568B) visibles dans le plastique. -->
    <g stroke-width="1.3" stroke-linecap="round">
      <path d="M60.8 40 V56" stroke="#F7C59F"/>
      <path d="M63.4 40 V56" stroke="#F28C28"/>
      <path d="M66 40 V56" stroke="#B9E3B0"/>
      <path d="M68.6 40 V56" stroke="#2F6FD6"/>
      <path d="M71.2 40 V56" stroke="#B7CDF4"/>
      <path d="M73.8 40 V56" stroke="#3FA34D"/>
      <path d="M76.4 40 V56" stroke="#D8C2A8"/>
      <path d="M79 40 V56" stroke="#7A4E2D"/>
    </g>
    <!-- Les 8 lames de contact dorées. -->
    <g fill="#F2B400">
      <rect x="60.1" y="29.5" width="1.4" height="8" rx="0.4"/>
      <rect x="62.7" y="29.5" width="1.4" height="8" rx="0.4"/>
      <rect x="65.3" y="29.5" width="1.4" height="8" rx="0.4"/>
      <rect x="67.9" y="29.5" width="1.4" height="8" rx="0.4"/>
      <rect x="70.5" y="29.5" width="1.4" height="8" rx="0.4"/>
      <rect x="73.1" y="29.5" width="1.4" height="8" rx="0.4"/>
      <rect x="75.7" y="29.5" width="1.4" height="8" rx="0.4"/>
      <rect x="78.3" y="29.5" width="1.4" height="8" rx="0.4"/>
    </g>
  </g>
</svg>
