[package]
name = "cablescope"
description = "Audit des ports, câbles et appareils USB : ce que votre câble limite vraiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
cablescope-model.workspace = true
cablescope-audit.workspace = true
cablescope-collect.workspace = true
cablescope-present.workspace = true
crossterm = { version = "0.28", default-features = false, features = ["events", "windows"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { workspace = true, features = ["derive"] }
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
